{% extends "base.html" %}
{% block title %}Log in · IndexHook{% endblock %}
{% block body %}
<section class="card narrow">
  <h1>Log in</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="{{ root }}/login">
    <label>User name <input name="username" value="{{ username or '' }}" autocomplete="username" required autofocus></label>
    <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
    <button>Log in</button>
  </form>
  {% if can_register %}<p class="hint"><a href="{{ root }}/register">Create an account</a></p>{% endif %}
</section>
{% endblock %}
