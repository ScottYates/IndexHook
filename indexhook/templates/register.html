{% extends "base.html" %}
{% block title %}Create an account · IndexHook{% endblock %}
{% block body %}
<section class="card narrow">
  <h1>Create an account</h1>
  {% if first %}<p class="hint">This is the first account. It becomes the admin.</p>{% endif %}
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="{{ root }}/register">
    <label>User name <input name="username" value="{{ username or '' }}" autocomplete="username" required autofocus></label>
    <label>Email <input type="email" name="email" value="{{ email or '' }}" autocomplete="email">
      <small>Notes are sent here unless you set another address.</small></label>
    <label>Password <input type="password" name="password" autocomplete="new-password" minlength="8" required></label>
    <label>Password again <input type="password" name="password2" autocomplete="new-password" minlength="8" required></label>
    <button>Create account</button>
  </form>
  <p class="hint"><a href="{{ root }}/login">Log in instead</a></p>
</section>
{% endblock %}
