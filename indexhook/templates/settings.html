{% extends "base.html" %}
{% import "_macros.html" as m %}
{% block title %}{{ title }} · IndexHook{% endblock %}
{% block body %}
{% if mode == "global" %}<p class="crumbs"><a href="{{ root }}/admin">Admin</a> / Server defaults</p>{% endif %}
<h1>{{ title }}</h1>
<p class="hint">{{ intro }}</p>
<form method="post" action="{{ root }}{{ action }}" class="settings">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  {{ m.fields(sections, mode) }}
  <div class="sticky"><button>Save</button></div>
</form>
{% endblock %}
