# Serve IndexHook under https://example.org/indexhook/ (set INDEXHOOK_ROOT_PATH=/indexhook).
location /indexhook/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 30m;      # keep above "Largest accepted recording" in Admin
    proxy_read_timeout 60s;
}
